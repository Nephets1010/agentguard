name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and verify
        run: ./mvnw -B -ntp verify

  spotless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Check formatting
        run: ./mvnw -B -ntp spotless:check

  architecture-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: core/policy/contract 禁止依赖 Spring
        run: |
          for module in agentguard-contract agentguard-core agentguard-policy; do
            if grep -rq "org.springframework" "$module/src/main/java"; then
              echo "::error::$module 不得依赖 org.springframework（零 Spring 约束被破坏）"
              exit 1
            fi
          done
          echo "OK: agentguard-contract / agentguard-core / agentguard-policy 无 Spring 依赖"
